<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Журнал и статистика</title>
<link rel="stylesheet" href="/lib/bootstrap.min.css"><link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="navbar"></div>
<div class="container-fluid">
  <div class="row g-3 mb-3" id="stats"></div>
  <h5>Проверенные ордера</h5>
  <table class="table table-sm table-bordered table-hover">
    <thead class="table-light"><tr>
      <th>№ ордера</th><th>Получатель</th><th>Начато</th><th>Завершено</th><th>Статус</th>
      <th class="text-center">Строк</th><th class="text-center">План</th><th class="text-center">Проверено</th>
      <th class="text-center">Отложено</th><th></th></tr></thead>
    <tbody id="body"></tbody>
  </table>
  <div id="detail"></div>
</div>
<script src="/lib/bootstrap.bundle.min.js"></script><script src="/common.js"></script>
<script>
document.getElementById('navbar').innerHTML = nav('/journal.html');
async function load() {
  const rows = await apiGet('/api/journal');
  const total = rows.length, plan = rows.reduce((a, r) => a + r.planQty, 0),
        ok = rows.reduce((a, r) => a + r.okQty, 0), bad = rows.reduce((a, r) => a + r.badQty, 0);
  document.getElementById('stats').innerHTML = [
    ['Ордеров', total, 'primary'], ['Единиц по плану', plan, 'secondary'],
    ['Кодов проверено', ok, 'success'], ['Отложено/ошибок', bad, 'danger']
  ].map(([t, v, c]) => `<div class="col-6 col-lg-3"><div class="card border-${c}"><div class="card-body py-2">
      <div class="text-muted small">${t}</div><div class="fs-4 fw-bold text-${c}">${v}</div></div></div></div>`).join('');
  document.getElementById('body').innerHTML = rows.map(r => `<tr>
    <td>${esc(r.orderNumber)}</td><td class="small">${esc(r.recipient)}</td>
    <td class="small">${esc(r.createdAt)}</td><td class="small">${esc(r.closedAt || '')}</td>
    <td>${r.status === 'active' ? '<span class="badge bg-warning text-dark">в работе</span>' : '<span class="badge bg-secondary">закрыт</span>'}</td>
    <td class="text-center">${r.lines}</td><td class="text-center">${r.planQty}</td>
    <td class="text-center">${r.okQty}</td><td class="text-center">${r.badQty}</td>
    <td class="text-nowrap">
      <button class="btn btn-sm btn-outline-secondary" onclick="detail(${r.id})">Просмотр</button>
      <a class="btn btn-sm btn-outline-primary" href="/api/orders/${r.id}/csv-full">Детали</a>
      <a class="btn btn-sm btn-outline-success" href="/api/orders/${r.id}/csv">CSV кодов</a></td></tr>`).join('');
}
async function detail(id) {
  const d = await apiGet('/api/journal/' + id);
  document.getElementById('detail').innerHTML = `<hr><h5>Ордер ${esc(d.order.orderNumber)}</h5>
    <div class="row g-3"><div class="col-lg-6">
      <h6>Строки</h6><table class="table table-sm table-bordered"><thead class="table-light">
      <tr><th>№</th><th>Код 1С</th><th>Товар</th><th>План</th><th>Проверено</th></tr></thead><tbody>
      ${d.lines.map(l => `<tr class="${l.scannedQty >= l.qty ? 'row-ok' : 'row-err'}"><td>${l.lineNo}</td>
        <td class="mono">${esc(l.code1C)}</td><td>${esc(l.name)}</td><td>${l.qty}</td><td>${l.scannedQty}</td></tr>`).join('')}
      </tbody></table></div>
    <div class="col-lg-6"><h6>Коды (${d.scans.length})</h6>
      <div class="scan-log border rounded"><table class="table table-sm mb-0"><thead class="table-light">
      <tr><th>Время</th><th>Товар</th><th>Серийный №</th><th>Статус</th></tr></thead><tbody>
      ${d.scans.map(s => `<tr class="${s.validationStatus === 'ok' ? 'row-ok' : 'row-err'}">
        <td class="small">${esc((s.createdAt || '').substring(11, 19))}</td><td class="small">${esc(s.productName)}</td>
        <td class="mono">${esc(s.serial)}</td><td class="small">${esc(statusRu(s.validationStatus))}<div class="text-muted">${esc(s.validationMessage)}</div></td></tr>`).join('')}
      </tbody></table></div></div></div>`;
  window.scrollTo(0, document.body.scrollHeight);
}
load();
</script>
</body>
</html>
